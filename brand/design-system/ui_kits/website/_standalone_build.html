/**
 * Light Personeelsdiensten — Card
 * White surface, 1px border, soft shadow that lifts on hover and gains a
 * faint red border. Optional image header with a subtle zoom on hover.
 */
function Card({
  image = null,
  imageAlt = '',
  imageHeight = 180,
  interactive = false,
  padding = 24,
  children,
  style = {},
  onClick,
}) {
  const [hover, setHover] = React.useState(false);
  const active = interactive && hover;

  return (
    <div
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        background: 'var(--color-bg)',
        border: '1px solid',
        borderColor: active ? 'var(--light-red-300)' : 'var(--color-border)',
        borderRadius: 'var(--radius-md)',
        boxShadow: active ? 'var(--shadow-md)' : 'var(--shadow-xs)',
        overflow: 'hidden',
        cursor: interactive ? 'pointer' : 'default',
        transition: 'box-shadow var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out)',
        transform: active ? 'translateY(-2px)' : 'none',
        ...style,
      }}
    >
      {image && (
        <div style={{ height: imageHeight, overflow: 'hidden' }}>
          <img
            src={image}
            alt={imageAlt}
            style={{
              width: '100%',
              height: '100%',
              objectFit: 'cover',
              display: 'block',
              transition: 'transform var(--dur-slow) var(--ease-out)',
              transform: active ? 'scale(1.04)' : 'scale(1)',
            }}
          />
        </div>
      )}
      <div style={{ padding }}>{children}</div>
    </div>
  );
}


// ===== components/buttons/Button.jsx =====


/**
 * Safe Lucide icon for React: renders a <span> wrapper that React manages,
 * and injects the Lucide <svg> imperatively as the span's innerHTML. Because
 * React never manages the swapped node, re-renders (hover/press) can't trigger
 * the "removeChild: node is not a child" crash that global lucide.createIcons()
 * causes when it replaces React-rendered <i data-lucide> elements.
 */
function BtnIcon({ name, size = 18, color, style = {} }) {
  if (!name) return null;
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el || !window.lucide) return;
    el.innerHTML = '<i data-lucide="' + name + '"></i>';
    try { window.lucide.createIcons(); } catch (e) { /* noop */ }
    const svg = el.querySelector('svg');
    if (svg) { svg.setAttribute('width', size); svg.setAttribute('height', size); }
  }, [name, size]);
  return React.createElement('span', {
    ref,
    'aria-hidden': true,
    style: { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: size, height: size, color, flex: 'none', ...style },
  });
}

/**
 * Light Personeelsdiensten — Button
 * Industrial, confident CTAs. Primary = brand red; the "notch" variant
 * applies the logo's cut-corner silhouette.
 */
function Button({
  variant = 'primary',
  size = 'md',
  notch = false,
  icon = null,
  iconRight = null,
  disabled = false,
  type = 'button',
  onClick,
  children,
  style = {},
}) {
  const [hover, setHover] = React.useState(false);
  const [press, setPress] = React.useState(false);

  const sizes = {
    sm: { fontSize: 13, padding: '8px 14px', gap: 6, icon: 16 },
    md: { fontSize: 15, padding: '12px 22px', gap: 8, icon: 18 },
    lg: { fontSize: 17, padding: '15px 30px', gap: 10, icon: 20 },
  };
  const s = sizes[size] || sizes.md;

  const base = {
    display: 'inline-flex',
    alignItems: 'center',
    justifyContent: 'center',
    gap: s.gap,
    fontFamily: 'var(--font-display)',
    fontWeight: 700,
    fontSize: s.fontSize,
    letterSpacing: '0.005em',
    padding: s.padding,
    border: '2px solid transparent',
    borderRadius: notch ? 0 : 'var(--radius-md)',
    clipPath: notch ? 'var(--clip-notch)' : 'none',
    cursor: disabled ? 'not-allowed' : 'pointer',
    opacity: disabled ? 0.5 : 1,
    transition: 'background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out)',
    lineHeight: 1.1,
    textDecoration: 'none',
    whiteSpace: 'nowrap',
  };

  const fill = (rest, hov, prs) => press ? prs : (hover ? hov : rest);

  const variants = {
    primary: {
      background: fill('var(--color-primary)', 'var(--color-primary-hover)', 'var(--color-primary-press)'),
      color: 'var(--color-on-primary)',
      boxShadow: hover && !disabled ? 'var(--shadow-red)' : 'none',
    },
    secondary: {
      background: fill('var(--grey-800)', 'var(--grey-900)', '#000'),
      color: '#fff',
    },
    outline: {
      background: hover ? 'var(--color-primary-soft)' : 'transparent',
      color: 'var(--color-primary)',
      borderColor: 'var(--color-primary)',
    },
    ghost: {
      background: hover ? 'var(--grey-100)' : 'transparent',
      color: 'var(--color-text)',
    },
  };

  const Icon = ({ name, sz }) =>
    name ? <BtnIcon name={name} size={sz} /> : null;

  return (
    <button
      type={type}
      disabled={disabled}
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => { setHover(false); setPress(false); }}
      onMouseDown={() => setPress(true)}
      onMouseUp={() => setPress(false)}
      style={{ ...base, ...(variants[variant] || variants.primary), ...style }}
    >
      <Icon name={icon} sz={s.icon} />
      {children}
      <Icon name={iconRight} sz={s.icon} />
    </button>
  );
}

/**
 * Light Personeelsdiensten — Badge
 * Small status pill. "tone" sets the colour; "solid" fills it.
 */
function Badge({ tone = 'red', solid = false, icon = null, children, style = {} }) {
  const tones = {
    red:     { fg: 'var(--light-red)',  bg: 'var(--light-red-50)',  solidBg: 'var(--light-red)' },
    grey:    { fg: 'var(--grey-700)',   bg: 'var(--grey-100)',      solidBg: 'var(--grey-700)' },
    green:   { fg: 'var(--green)',      bg: '#e7f3ec',              solidBg: 'var(--green)' },
    amber:   { fg: 'var(--amber)',      bg: '#f7eed9',              solidBg: 'var(--amber)' },
    blue:    { fg: 'var(--blue)',       bg: '#e4eef5',              solidBg: 'var(--blue)' },
    dark:    { fg: '#fff',              bg: 'var(--grey-800)',      solidBg: 'var(--grey-800)' },
  };
  const t = tones[tone] || tones.red;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 5,
      fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 11.5,
      letterSpacing: '0.05em', textTransform: 'uppercase',
      padding: '4px 10px', borderRadius: 'var(--radius-pill)',
      color: solid ? '#fff' : t.fg,
      background: solid ? t.solidBg : t.bg,
      whiteSpace: 'nowrap', ...style,
    }}>
      {icon && <BadgeIcon name={icon} size={13} />}
      {children}
    </span>
  );
}

/**
 * Light Personeelsdiensten — Tag
 * Neutral filter/keyword chip. Optional selected + removable states.
 */
function Tag({ selected = false, removable = false, onRemove, children, onClick, style = {} }) {
  const [hover, setHover] = React.useState(false);
  return (
    <span
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        display: 'inline-flex', alignItems: 'center', gap: 6,
        fontFamily: 'var(--font-body)', fontWeight: 600, fontSize: 13.5,
        padding: '6px 12px', borderRadius: 'var(--radius-pill)',
        border: '1px solid',
        borderColor: selected ? 'var(--light-red)' : (hover ? 'var(--border-color-strong, var(--color-border-strong))' : 'var(--color-border)'),
        background: selected ? 'var(--light-red)' : (hover ? 'var(--grey-50)' : 'var(--color-bg)'),
        color: selected ? '#fff' : 'var(--color-text)',
        cursor: onClick ? 'pointer' : 'default',
        transition: 'all var(--dur-fast) var(--ease-out)',
        ...style,
      }}
    >
      {children}
      {removable && (
        <TagIcon
          name="x"
          size={14}
          onClick={(e) => { e.stopPropagation(); onRemove && onRemove(); }}
          style={{ cursor: 'pointer', opacity: 0.8 }}
        />

/**
 * Light Personeelsdiensten — Input (text field)
 * Label + field with red focus ring. Optional leading Lucide icon.
 */
function Input({
  label,
  type = 'text',
  placeholder = '',
  value,
  defaultValue,
  onChange,
  icon = null,
  hint = null,
  error = null,
  required = false,
  id,
  style = {},
}) {
  const [focus, setFocus] = React.useState(false);
  const inputId = id || (label ? label.toLowerCase().replace(/\s+/g, '-') : undefined);
  const borderColor = error ? 'var(--light-red)' : (focus ? 'var(--light-red)' : 'var(--color-border-strong)');

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, ...style }}>
      {label && (
        <label htmlFor={inputId} style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 13.5, color: 'var(--color-text)' }}>
          {label}{required && <span style={{ color: 'var(--light-red)' }}> *</span>}
        </label>
      )}
      <div style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
        {icon && (
          <InputIcon name={icon} size={17} style={{ position: 'absolute', left: 12, color: 'var(--color-text-subtle)', pointerEvents: 'none' }} />
        )}
        <input
          id={inputId}
          type={type}
          placeholder={placeholder}
          value={value}
          defaultValue={defaultValue}
          onChange={onChange}
          onFocus={() => setFocus(true)}
          onBlur={() => setFocus(false)}
          style={{
            width: '100%',
            boxSizing: 'border-box',
            fontFamily: 'var(--font-body)',
            fontSize: 15,
            color: 'var(--color-text)',
            padding: icon ? '11px 14px 11px 38px' : '11px 14px',
            background: 'var(--color-bg)',
            border: `1.5px solid ${borderColor}`,
            borderRadius: 'var(--radius-sm)',
            outline: 'none',
            boxShadow: focus ? '0 0 0 3px var(--color-focus-ring)' : 'none',
            transition: 'border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out)',
          }}
        />
      </div>
      {(hint || error) && (
        <span style={{ fontFamily: 'var(--font-body)', fontSize: 12.5, color: error ? 'var(--light-red)' : 'var(--color-text-muted)' }}>
          {error || hint}
        </span>
      )}
    </div>
  );
}

/**
 * Light Personeelsdiensten — Select (dropdown)
 * Native select styled to match Input, with a Lucide chevron.
 */
function Select({ label, options = [], value, defaultValue, onChange, required = false, id, style = {} }) {
  const [focus, setFocus] = React.useState(false);
  const selId = id || (label ? label.toLowerCase().replace(/\s+/g, '-') : undefined);
  const norm = options.map((o) => (typeof o === 'string' ? { value: o, label: o } : o));

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, ...style }}>
      {label && (
        <label htmlFor={selId} style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 13.5, color: 'var(--color-text)' }}>
          {label}{required && <span style={{ color: 'var(--light-red)' }}> *</span>}
        </label>
      )}
      <div style={{ position: 'relative' }}>
        <select
          id={selId}
          value={value}
          defaultValue={defaultValue}
          onChange={onChange}
          onFocus={() => setFocus(true)}
          onBlur={() => setFocus(false)}
          style={{
            width: '100%',
            boxSizing: 'border-box',
            appearance: 'none',
            WebkitAppearance: 'none',
            fontFamily: 'var(--font-body)',
            fontSize: 15,
            color: 'var(--color-text)',
            padding: '11px 38px 11px 14px',
            background: 'var(--color-bg)',
            border: `1.5px solid ${focus ? 'var(--light-red)' : 'var(--color-border-strong)'}`,
            borderRadius: 'var(--radius-sm)',
            outline: 'none',
            boxShadow: focus ? '0 0 0 3px var(--color-focus-ring)' : 'none',
            cursor: 'pointer',
            transition: 'border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out)',
          }}
        >
          {norm.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
        <SelIcon name="chevron-down" size={18} style={{ position: 'absolute', right: 12, top: '50%', transform: 'translateY(-50%)', color: 'var(--color-text-subtle)', pointerEvents: 'none' }} />
      </div>
    </div>
  );
}

/**
 * Light Personeelsdiensten — JobCard (vacaturekaart)
 * Domain card for a single vacancy: photo, title, location/hours meta,
 * short teaser, read-time, and a red "Lees meer" affordance.
 */
function JobCard({
  title,
  image,
  imageAlt = '',
  category = 'Productie',      // Productie | Logistiek | Schoonmaak
  location = 'Rotterdam',
  hours = 'Fulltime',
  teaser,
  readTime,
  onClick,
  style = {},
}) {
  const catIcon = {
    Productie: 'factory',
    Logistiek: 'truck',
    Schoonmaak: 'spray-can',
  }[category] || 'briefcase';

  const Meta = ({ icon, children }) => (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 13, color: 'var(--color-text-muted)', fontFamily: 'var(--font-body)' }}>
      <JobIcon name={icon} size={14} />
      {children}
    </span>
  );

  return (
    <Card image={image} imageAlt={imageAlt} interactive padding={20} onClick={onClick} style={style}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        <span style={{
          alignSelf: 'flex-start', display: 'inline-flex', alignItems: 'center', gap: 6,
          fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 11, letterSpacing: '0.08em',
          textTransform: 'uppercase', color: 'var(--color-primary)',
          background: 'var(--color-primary-soft)', padding: '5px 10px', borderRadius: 'var(--radius-pill)',
        }}>
          <JobIcon name={catIcon} size={13} />{category}
        </span>

        <h3 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 20, lineHeight: 1.2, color: 'var(--color-text)', margin: 0 }}>
          {title}
        </h3>

        <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>
          <Meta icon="map-pin">{location}</Meta>
          <Meta icon="clock">{hours}</Meta>
        </div>

        {teaser && (
          <p style={{ fontFamily: 'var(--font-body)', fontSize: 14.5, lineHeight: 1.55, color: 'var(--color-text-muted)', margin: 0 }}>
            {teaser}
          </p>
        )}

        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 4 }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 14, color: 'var(--color-primary)' }}>
            Lees meer <JobIcon name="arrow-right" size={16} />
          </span>
          {readTime && (
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11.5, color: 'var(--color-text-subtle)' }}>{readTime}</span>
          )}
        </div>
      </div>
    </Card>
  );
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function ContentSection({ children, soft = false, style = {} }) {
  return (
    <section style={{ background: soft ? 'var(--color-bg-soft)' : 'var(--color-bg)',
      borderTop: soft ? '1px solid var(--color-border)' : 'none', ...style }}>
      <div style={{ maxWidth: 'var(--container-max)', margin: '0 auto', padding: '64px 24px' }}>{children}</div>
    </section>
  );
}

function SectionEyebrow({ children }) {
  return <span className="light-eyebrow" style={{ display: 'block', marginBottom: 10 }}>{children}</span>;
}

function Para({ children, style = {} }) {
  return (
    <p className="light-body" style={{ fontSize: 16.5, color: 'var(--color-text-muted)', margin: '0 0 18px', maxWidth: 780, ...style }}>
      {children}
    </p>
  );
}

function CheckList({ items, columns = 1 }) {
  return (
    <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'grid',
      gridTemplateColumns: `repeat(${columns}, minmax(0, 1fr))`, gap: '14px 28px' }}>
      {items.map((it) => (
        <li key={it} style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
          <span style={{ width: 26, height: 26, borderRadius: '999px', background: 'var(--color-primary-soft)',
            display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flex: 'none', marginTop: 1 }}>
            <i data-lucide="check" style={{ width: 15, height: 15, color: 'var(--light-red)' }} />
          </span>
          <span className="light-body" style={{ fontSize: 15.5, lineHeight: 1.5 }}>{it}</span>
        </li>
      ))}
    </ul>
  );
}

// Icon-on-tile feature block used inside content sections.
function FeatureCard({ icon, title, children }) {
  return (
    <Card padding={26} style={{ display: 'flex', flexDirection: 'column', gap: 12, height: '100%' }}>
      <span style={{ width: 46, height: 46, borderRadius: 'var(--radius-md)', background: 'var(--color-primary-soft)',
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flex: 'none' }}>
        <i data-lucide={icon} style={{ width: 22, height: 22, color: 'var(--light-red)' }} />
      </span>
      <h3 className="light-h3" style={{ fontSize: 20 }}>{title}</h3>
      <p className="light-body" style={{ fontSize: 14.5, color: 'var(--color-text-muted)', margin: 0, lineHeight: 1.6 }}>{children}</p>
    </Card>
  );
}

// Footer — dark grey, logo + address + links + SNA certification.
function Footer({ onNav }) {
  const Col = ({ title, children }) => (
    <div>
      <div style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 13, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#fff', marginBottom: 16 }}>{title}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>{children}</div>
    </div>
  );
  const FLink = ({ children, onClick }) => (
    <a href="#" onClick={(e) => { e.preventDefault(); onClick && onClick(); }} style={{ color: 'var(--color-text-on-dark-muted)', textDecoration: 'none', fontSize: 14.5 }}>{children}</a>
  );
  return (
    <footer style={{ background: 'var(--grey-900)', color: '#fff' }}>
      <div style={{ maxWidth: 'var(--container-max)', margin: '0 auto', padding: '56px 24px 32px', display: 'grid', gridTemplateColumns: '1.4fr 1fr 1fr 1fr', gap: 40 }}>

          </div>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 24, minHeight: 380 }}>
          {shown.map((v) => <JobCard key={v.title} {...v} onClick={() => onNav('Contact')} />)}
          {shown.length === 0 && (
            <p className="light-body" style={{ color: 'var(--color-text-muted)' }}>Geen openstaande vacatures in deze categorie.</p>
          )}
        </div>
      </ContentSection>

      <ContentSection soft>
        <SectionEyebrow>Wat we vragen</SectionEyebrow>
        <h2 className="light-h2" style={{ marginBottom: 28, maxWidth: 640 }}>Wat werken bij Light betekent</h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20, marginBottom: 44 }}>
          {verwachting.map((v) => (
            <FeatureCard key={v.title} icon={v.icon} title={v.title}>{v.body}</FeatureCard>
          ))}
        </div>

        <div style={{ background: 'var(--light-red)', color: '#fff', borderRadius: 'var(--radius-lg)', padding: '34px 36px',
          display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 28, flexWrap: 'wrap', boxShadow: 'var(--shadow-red)' }}>
          <div>
            <h3 className="cta-title" style={{ fontFamily: 'var(--font-display)', fontSize: 24, margin: 0 }}>Geen passende vacature gevonden?</h3>
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 16, opacity: 0.94, margin: '10px 0 0', maxWidth: 520 }}>
              Stuur een open sollicitatie — wij nemen je op in ons bestand en benaderen je zodra er een passende plek is.
            </p>
          </div>
          <a href="mailto:vacature@lightpersoneelsdiensten.nl" style={{ textDecoration: 'none' }}>
            <Button variant="secondary" size="lg" notch iconRight="send">Stuur je sollicitatie</Button>
          </a>
        </div>
      </ContentSection>
    </>
  );
}

// App — Light marketing site. Multi-page: Home + Over ons, Zakelijke diensten,
// Vacatures en Contact. Header/Footer blijven staan; de body wisselt op de
// actieve nav-keuze.
function App() {
  const [active, setActive] = React.useState('Home');
  const [t, setTweak] = useTweaks(window.TWEAK_DEFAULTS || { logoBg: 'soft', headingWeight: 700, statement: 'De juiste mensen, op de juiste plek.' });

  React.useEffect(() => { if (window.lucide) lucide.createIcons(); }, [active, t]);
  React.useEffect(() => { window.scrollTo({ top: 0, behavior: 'auto' }); }, [active]);

  const headerBg = t.logoBg === 'soft' ? 'var(--grey-50)' : '#fff';
  const STATEMENTS = [
    'Wij houden de productie draaiend.',
    'De productie moet draaien.',
    'Wij kennen de klappen van de zweep.',
    'Van begin tot eindproduct — wij regelen het.',
    'De juiste mensen, op de juiste plek.',
    'De productie moet draaien. Punt.',
  ];

  const onNav = (label) => setActive(label);

  let body;
  switch (active) {
    case 'Over ons': body = <OverOns onNav={onNav} />; break;
    case 'Zakelijke diensten': body = <ZakelijkeDiensten onNav={onNav} />; break;
    case 'Vacatures': body = <VacaturesPage onNav={onNav} />; break;
    case 'Contact': body = <ContactPage onNav={onNav} />; break;
    default:
      body = (
        <>
          <Hero onNav={onNav} />
          <ServiceTiles onNav={onNav} />
          <VacancyFeed onNav={onNav} />
        </>
      );
  }

  return (
    <div className="light-body" style={{ background: '#fff' }}>
      <style>{`
        .light-h1, .light-h2 { font-weight: ${t.headingWeight} !important; }
        .cta-title { font-weight: ${t.headingWeight} !important; }
      `}</style>
      <Header onNav={onNav} active={active} headerBg={headerBg} />
      {body}
      {active !== 'Contact' && <CtaBand onNav={onNav} statement={t.statement} />}
      <Footer onNav={onNav} />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Logo" />
        <TweakRadio label="Logo-achtergrond" value={t.logoBg}
          options={[{ value: 'white', label: 'Wit' }, { value: 'soft', label: 'Lichtgrijs' }]}
          onChange={(v) => setTweak('logoBg', v)} />
        <TweakSection label="Typografie" />
        <TweakRadio label="Kopgewicht" value={t.headingWeight}
          options={[{ value: 800, label: '800' }, { value: 700, label: '700' }, { value: 600, label: '600' }]}
          onChange={(v) => setTweak('headingWeight', v)} />
        <TweakSection label="Statement" />
        <TweakSelect label="CTA-tekst" value={t.statement}
          options={STATEMENTS} onChange={(v) => setTweak('statement', v)} />
      </TweaksPanel>
    </div>
  );
}
